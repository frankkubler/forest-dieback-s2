# Paramètres du pipeline. Les chemins sont relatifs à la racine du dépôt.

gee:
  project: forest-dieback-s2            # surchargé par la variable d'environnement GEE_PROJECT
  drive_folder: forest-dieback-s2

aoi:
  name: hautes-vosges-thur-doller
  # Carré d'environ 20 x 20 km couvrant les vallées de la Thur et de la Doller (WGS84)
  bbox: [6.88, 47.75, 7.15, 47.93]   # [lon_min, lat_min, lon_max, lat_max]
  crs: EPSG:32632                    # UTM 32N

sentinel2:
  collection: COPERNICUS/S2_SR_HARMONIZED
  cloud_score: GOOGLE/CLOUD_SCORE_PLUS/V1/S2_HARMONIZED
  cloud_score_band: cs_cdf
  clear_threshold: 0.60     # pixel conservé si cs_cdf >= seuil
  start_date: "2017-01-01"
  end_date: "2026-10-01"
  bands: [B4, B8, B8A, B11, B12]   # le nécessaire pour CRSWIR, NDVI et NDWI
  tiles: [32TLT, 32ULU]     # tuiles MGRS retenues ; null : toutes celles qui touchent la zone.
                            # Quatre tuiles voient les Hautes-Vosges et livrent les mêmes dates ;
                            # garder la seule zone UTM 32 évite une reprojection des réflectances.
  composite_days: 10        # composites médians sur une grille de 10 jours
  scale: 10                 # m ; les bandes à 20 m sont rééchantillonnées

extraction:
  mask_asset: projects/forest-dieback-s2/assets/bdforet_epicea          # asset GEE des épicéas (scripts/prepare_spruce_mask.py) ;
                            # null : classe « arbres » d'ESA WorldCover
  n_samples: 5000           # pixels tirés pour la commande « samples »
  seed: 42

fordead:                    # méthode de référence (package GPL-3, extra « fordead »)
  fit_start: "2017-01-01"   # modèle harmonique sur les années réputées saines ;
  fit_end: "2017-12-31"     # la crise de scolytes des Vosges démarre en 2018
  predict_start: "2018-01-01"
  predict_end: null         # défaut : sentinel2.end_date
  threshold: null           # écart au modèle déclenchant une anomalie (défaut fordead : 0.16)
  nmax_anomaly: null        # anomalies consécutives avant confirmation (défaut : 3)
  write: [ANOMALY_CONFIRMED, ANOMALY_INDEX, DEVIATION]
                          # couches écrites. Les 14 par défaut pèsent l'essentiel du
                          # volume ; ces trois suffisent à comparer avec le modèle.
                          # null : tout écrire, [] : rien que le modèle.

indices: [CRSWIR, NDVI, NDWI]
indices_range:              # plages physiques ; au-delà, c'est un artefact, pas une mesure
  CRSWIR: [0.0, 2.0]        # les ombres de relief hivernales annulent le continuum

labels:
  fordead_dir: data/raw/fordead
  spruce_essences: ["Sapin, épicéa", "Conifères"]
                          # essences BD Forêt V2 du masque. « Conifères » désigne les
                          # résineux non différenciés, ici surtout sapin-épicéa.
                          # « Mixte » (33 % de la zone) est écarté : la plupart de ses
                          # pixels n'ont pas d'épicéa et bruiteraient les étiquettes.
  spruce_mask: data/raw/bdforet_epicea.gpkg
  control_points: data/raw/control_points.gpkg
  dieback_maps: data/raw/fordead/carto_fordead_V2023_06/cartographie/deperissement_*.shp
  dieback_class_field: class
  dieback_date_field: Date      # mois de première anomalie (AAAA-MM)
  dieback_positive: ["1-Faible anomalie", "2-Moyenne anomalie", "3-Forte anomalie"]
  dieback_excluded: ["4-Sol nu"]
                          # le sol nu suit parfois une attaque, parfois une coupe ordinaire :
                          # ces pixels sortent du jeu au lieu d'être étiquetés à tort.
  dieback_until: "2024-01-01"
                          # les cartes s'arrêtent en 2023 ; au-delà, un pixel dépérissant
                          # serait étiqueté sain, et le modèle apprendrait ce bruit.

dataset:
  block_size_m: 2000        # taille des blocs spatiaux pour le découpage train/val/test
  split: {train: 0.7, val: 0.15, test: 0.15}
  seed: 42

model:
  name: tempcnn
  hidden: 64
  kernel_size: 5
  dropout: 0.2
  pool: 8                   # pas de temps vus par la tête dense. Aplatir les 259
                            # composites y mettait 99 % des paramètres du modèle.

train:
  epochs: 30
  batch_size: 512
  lr: 1.0e-3
  weight_decay: 1.0e-4
  mlflow_experiment: forest-dieback-s2

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  models: models
