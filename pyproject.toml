[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forest-dieback"
version = "0.1.0"
description = "Détection du dépérissement des épicéas par séries temporelles Sentinel-2"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Frank Kubler" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
  "torch>=2.2",
  "matplotlib>=3.8",
  "mlflow>=2.12",
]

[project.optional-dependencies]
gee = ["earthengine-api>=1.0", "geemap>=0.32"]
geo = ["xarray>=2024.1", "rioxarray>=0.15", "geopandas>=0.14", "zarr>=2.17"]
onnx = ["onnx>=1.16", "onnxruntime>=1.17"]
dev = ["pytest>=8.0", "ruff>=0.4", "forest-dieback[gee,geo,onnx]"]

[project.scripts]
fd-train = "forest_dieback.train:main"
fd-export = "forest_dieback.export:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
