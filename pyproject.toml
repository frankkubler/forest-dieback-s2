[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forest-dieback"
version = "0.1.0"
description = "Détection du dépérissement des épicéas par séries temporelles Sentinel-2"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Frank Kubler" }]
# fordead v2.3 passe par simplestac 2.x, qui demande 3.12
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "torch>=2.2",
  "matplotlib>=3.8",
  "mlflow>=2.12",
  "onnx>=1.16",
  "onnxruntime>=1.17",
]

[project.optional-dependencies]
gee = ["earthengine-api>=1.0", "geemap>=0.32"]
geo = ["xarray>=2024.1", "rioxarray>=0.15", "geopandas>=0.14", "zarr>=2.17"]
fordead = [
    "fordead",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
fd-train = "forest_dieback.train:main"
fd-export = "forest_dieback.export:main"

[tool.setuptools.packages.find]
where = ["src"]

# PyTorch CPU (plus léger que les roues CUDA de PyPI) sous Linux et Windows ;
# sous macOS, la roue PyPI est déjà CPU/MPS.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
fordead = { git = "https://gitlab.com/fordead/fordead_package", rev = "v2.3.0" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
