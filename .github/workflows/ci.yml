name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install
        # --locked dès que uv.lock est versionné
        run: uv sync --all-extras $([ -f uv.lock ] && echo --locked)
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Test
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t forest-dieback-s2 .
      - name: Run demo
        run: docker run --rm forest-dieback-s2
